name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: 'Commit SHA, Branch, or Tag to build (leave empty for default branch)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.commit_sha }}

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 --decode > release.keystore
          echo "KEYSTORE_PATH=release.keystore" >> $GITHUB_ENV
        else
          echo "No keystore provided, release build will be unsigned"
        fi

    - name: Build Release APK
      env:
        KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease

    - name: Rename and Prepare Artifacts
      run: |
        # Extract version name from app/build.gradle.kts
        VERSION_NAME=$(grep "versionName =" app/build.gradle.kts | awk -F'"' '{print $2}')
        if [ -z "$VERSION_NAME" ]; then
          VERSION_NAME="unknown"
        fi
        
        APK_DIR="app/build/outputs/apk/release"
        ORIGINAL_APK="$APK_DIR/app-release.apk"
        RENAMED_APK="$APK_DIR/JKWallet-v${VERSION_NAME}-release.apk"
        
        if [ -f "$ORIGINAL_APK" ]; then
          mv "$ORIGINAL_APK" "$RENAMED_APK"
          echo "APK_PATH=$RENAMED_APK" >> $GITHUB_ENV
          echo "VERSION_TAG=v${VERSION_NAME}" >> $GITHUB_ENV
        else
          UNSIGNED_APK="$APK_DIR/app-release-unsigned.apk"
          if [ -f "$UNSIGNED_APK" ]; then
            mv "$UNSIGNED_APK" "$APK_DIR/JKWallet-v${VERSION_NAME}-release-unsigned.apk"
            echo "APK_PATH=$APK_DIR/JKWallet-v${VERSION_NAME}-release-unsigned.apk" >> $GITHUB_ENV
            echo "VERSION_TAG=v${VERSION_NAME}-unsigned" >> $GITHUB_ENV
          else
            echo "Error: Release APK not found!"
            exit 1
          fi
        fi

    - name: Create GitHub Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Try creating the release with auto-generated release notes (changelog from commits)
        gh release create "${{ env.VERSION_TAG }}" \
          --title "Release ${{ env.VERSION_TAG }}" \
          --generate-notes || true
        
        # Upload the asset. --clobber will overwrite the file if it already exists.
        gh release upload "${{ env.VERSION_TAG }}" "${{ env.APK_PATH }}" --clobber
