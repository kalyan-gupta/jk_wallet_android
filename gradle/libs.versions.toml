[versions]
agp = "9.3.1"
kotlin = "2.1.10"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
appcompat = "1.7.0"
material = "1.12.0"
composeBom = "2025.02.00"
navigationCompose = "2.9.8"
hilt = "2.60.1"
